name = "ca-admin-panel"
compatibility_date = "2024-09-23"

# Cloudflare Pages — build output
pages_build_output_dir = "dist"

# ─── Dev vars ─────────────────────────────────────────────────────────────────
[vars]
VITE_API_BASE_URL = "http://localhost:5000/api"
VITE_APP_NAME = "CA Admin Portal"
VITE_APP_VERSION = "2.0.0"

# ─── Production ───────────────────────────────────────────────────────────────
# Deploy to: admin.protechplanner.in via Cloudflare Pages custom domain
# Build command: npm run build
# Build output: dist/

[env.production.vars]
VITE_API_BASE_URL = "https://ca-website-backend-production.reg-apaonline.workers.dev/api"
VITE_APP_NAME = "CA Admin Portal"
VITE_APP_VERSION = "2.0.0"
